<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Coffee System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
        body { background-color: #fdf6e3; color: #3e2723; }
        header { background: #3e2723; color: #fff; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; }
        header h2 { letter-spacing: 2px; }
        .cart-btn { background: #d7ccc8; color: #3e2723; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .hero { height: 60vh; background: url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=1471&q=80') center/cover; display: flex; align-items: center; padding: 0 50px; }
        .hero-text { background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 10px; max-width: 500px; }
        .menu { padding: 50px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-top: 30px; }
        .item { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .item img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        .add-btn { margin-top: 15px; width: 100%; padding: 10px; background: #3e2723; color: white; border: none; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        .add-btn:hover { background: #5d4037; }
    </style>
</head>
<body>
    <header>
        <h2><i class="fas fa-coffee"></i> Aroma Roasters</h2>
        <button class="cart-btn"><i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">0</span>)</button>
    </header>
    <section class="hero">
        <div class="hero-text">
            <h1>Freshly Brewed Every Day</h1>
            <p>Order your favorite coffee online and skip the line. Hand-crafted with passion.</p>
        </div>
    </section>
    <section class="menu">
        <h2>Our Premium Menu</h2>
        <div class="grid">
            <div class="item">
                <img src="https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?auto=format&fit=crop&w=500&q=60" alt="Espresso">
                <h3>Double Espresso</h3>
                <p>40 EGP</p>
                <button class="add-btn" onclick="addToCart()">Add to Order</button>
            </div>
            <div class="item">
                <img src="https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?auto=format&fit=crop&w=500&q=60" alt="Latte">
                <h3>Caramel Latte</h3>
                <p>65 EGP</p>
                <button class="add-btn" onclick="addToCart()">Add to Order</button>
            </div>
            <div class="item">
                <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=500&q=60" alt="Cold Brew">
                <h3>Signature Cold Brew</h3>
                <p>55 EGP</p>
                <button class="add-btn" onclick="addToCart()">Add to Order</button>
            </div>
        </div>
    </section>
    <script>
        let count = 0;
        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
            alert("Added to your order!");
        }
    </script>
</body>
</html>
